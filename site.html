<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div>
	<button id="yt-redirect" type="button">Click me!</button>
</div>

<script>
    // Открывает видео в новой вкладке при клике на кнопку
    document.getElementById('yt-redirect').addEventListener('click', function() {
        window.open('https://www.youtube.com/watch?v=dQw4w9WgXcQ', '_blank', 'noopener,noreferrer');
    });
</script>


</body>
</html>
